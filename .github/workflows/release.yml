name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore ParentalLock.sln
      - name: Publish self-contained agent
        run: >
          dotnet publish src/FoXKidLockAgent/FoXKidLockAgent.csproj -c Release -r win-x64
          --self-contained true /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true
          -o dist/agent-win64
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Create installer
        run: iscc installer/setup.iss
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoXKidLockAgent-Windows
          path: dist/installer/*.exe
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/installer/*.exe
